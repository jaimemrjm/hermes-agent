services:
  camofox-browser:
    image: camofox-browser:135.0.1-aarch64897
    
    container_name: camofox-browser
    restart: unless-stopped
    ports:
      - "9377:9377"
    environment:
      - CAMOFOX_PORT=9377
    networks:
      - hermes-net

  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"
    volumes:
      - ~/.hermes:/opt/data
    networks:
      - hermes-net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

networks:
  hermes-net:
    driver: bridge
